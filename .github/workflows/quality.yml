---
on:
  - pull_request
  - push

name: quality

permissions:
  contents: read

jobs:
  skill-validation:
    name: Skill validation
    runs-on: ubuntu-latest

    concurrency:
      cancel-in-progress: true
      group: skill-validation-${{ github.workflow }}-${{ github.ref }}

    steps:
      - name: Checkout repository.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP.
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          coverage: none
          php-version: "8.2"

      - name: Validate portable skills.
        run: php tools/validate-skills.php

  quality:
    uses: yii2-framework/actions/.github/workflows/quality.yml@f0e06ea5cc965cff4431177d448add7b7c98668b # v2.0.1
    permissions:
      contents: read
    with:
      codespell-config: .github/linters/.codespellrc
      editorconfig-checker-config: .github/linters/.editorconfig-checker.json
      markdownlint-config: .github/linters/.markdown-lint.yml
      prettier-config: .prettierrc.json
      prettier-ignore-path: .prettierignore
      yamllint-config: .github/linters/.yamllint.yml
      yamllint-targets: .github
